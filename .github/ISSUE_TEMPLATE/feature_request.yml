name: 功能建议 · Feature request
description: 想要新的能力位规则、新的面板入口、或者更细的审计
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **请先看 README §8 的边界清单**：有些事不是"还没做"，是 DSH 的现有边界（比如 `pwsh` 子进程不认额外根）。
        提之前先说清：这条需求要突破的是**策略层**，还是**内核层**？
  - type: textarea
    id: problem
    attributes:
      label: 你现在的麻烦 · The problem
      description: 描述场景，不要先给方案。"我在 X 项目里需要 Y，现在只能 Z。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的形状 · Proposed shape
      description: 命令 / 配置字段 / 面板按钮，长什么样？
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代 · Alternatives tried
      description: 包括为什么它们不够用。
  - type: dropdown
    id: layer
    attributes:
      label: 属于哪一层 · Which layer
      options:
        - 规则层（本项目能做）
        - 授权层（要 DSH 的 registerWritableRoot）
        - 执行层（要改 DSH 内核，大概率不做）
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提 PR（可以先聊清设计再动手）
